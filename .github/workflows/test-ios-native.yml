name: Native iOS tests

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/core/native/**'
      - 'lib/core/chat/**'
      - '.github/workflows/test-ios-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Prepare simulator build
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter build ios --simulator --debug
      - name: Select iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'simulators.json').read_text())['devices']
          phone = next(device for runtime, group in devices.items() if 'iOS' in runtime for device in group if device['name'].startswith('iPhone'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"IOS_TEST_DEVICE={phone['udid']}\n")
          PY
      - name: Run RunnerTests
        run: |
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_TEST_DEVICE" \
            -only-testing:RunnerTests \
            -resultBundlePath build/RunnerTests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-test-results
          path: build/RunnerTests.xcresult
          if-no-files-found: ignore
