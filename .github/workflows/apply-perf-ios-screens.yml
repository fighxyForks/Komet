name: Apply perf iOS screen patches

on:
  push:
    branches: [perf/ios-flutter-baseline]
    paths:
      - 'patches/perf-ios-flutter-baseline/**'
      - '.github/workflows/apply-perf-ios-screens.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ios-flutter-baseline
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply screen patches and push
        run: |
          set -euo pipefail
          git config user.name "Ivan K"
          git config user.email "57476075+fighxy@users.noreply.github.com"
          if git apply --check patches/perf-ios-flutter-baseline/chat_screen.patch \
             && git apply --check patches/perf-ios-flutter-baseline/chat_list_screen.patch; then
            git apply patches/perf-ios-flutter-baseline/chat_screen.patch
            git apply patches/perf-ios-flutter-baseline/chat_list_screen.patch
            git add lib/frontend/screens/chats/chat_screen.dart \
                    lib/frontend/screens/chats/chat_list_screen.dart
            git commit -m "perf(ios): apply chat-list ticker/reload skip and shared local-history Future"
            git push origin HEAD:perf/ios-flutter-baseline
          else
            echo "Patches already applied or context mismatch"
            git apply --check patches/perf-ios-flutter-baseline/chat_screen.patch || true
            git apply --check patches/perf-ios-flutter-baseline/chat_list_screen.patch || true
            exit 0
          fi
